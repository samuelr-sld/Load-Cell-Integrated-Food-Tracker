[pytest]
# Run from the repository root:  python -m pytest -c testbench/pytest.ini testbench/tests
pythonpath = ..
cache_dir = .pytest_cache
testpaths = tests
markers =
    live: loads the real YOLO + MobileNet checkpoints and real images (deselect with -m "not live")
filterwarnings =
    ignore::DeprecationWarning
